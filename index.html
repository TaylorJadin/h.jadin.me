<!DOCTYPE html>
<html style="height: 100%;">

<head>
    <title>New Tab</title>
    <link rel="icon" href="https://jadin.me/favicon.ico">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/mode/overlay.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/gfm/gfm.min.js"></script>
    <style>
        * {
            font-size: 1rem;
        }

        .cm-s-monokai .CodeMirror-linenumber {
            color: #75715e;
        }

        /* Full height code editor */
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #code-editor {
            height: 100%;
        }

        /* Monokai modifications */
        body,
        .cm-s-monokai.CodeMirror,
        .CodeMirror-gutter {
            background-color: rgba(23, 23, 23, 1);
        }

        .cm-s-monokai span.cm-comment {
            color: #a6e22e;
        }

        .cm-s-monokai span.cm-link {
            color: #9effff;
            text-decoration: none;
        }

        .cm-s-monokai span.cm-variable-2 {
            color: #e6db74;
        }

        .cm-s-monokai span.cm-url {
            color: #f92672;
            text-decoration: underline;
        }

        /* Widget styles */
        .widgets {
            position: fixed;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            z-index: 1000;
            /* Ensure it floats above other elements */
            display: flex;
            align-items: center;
        }

        #clock {
            top: 10px;
            cursor: pointer;
        }

        @media screen and (max-width: 600px) {
            #clock {
                top: unset;
                bottom: 90px;
            }
        }

        #weather {
            bottom: 10px;
            display: none;
        }

        #forecast-image {
            max-height: 60px;
            margin-right: 10px
        }

        #forecast-links>a>img {
            max-height: 35px;
        }

        /* Bookmarks widget styles */
        #bookmarks-widget {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: rgba(40, 40, 40, 0.9);
            color: #f8f8f2;
            z-index: 1000;
            font-family: Arial, sans-serif;
            padding: 5px;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        #bookmarks-widget a {
            color: #f8f8f2;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 3px;
            margin: 0 2px;
            display: inline-block;
            transition: background-color 0.2s;
        }

        #bookmarks-widget a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        #bookmarks-widget .folder {
            position: relative;
            display: inline-block;
        }

        #bookmarks-widget .folder > span {
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 3px;
            margin: 0 2px;
            display: inline-block;
            transition: background-color 0.2s;
        }

        #bookmarks-widget .folder > span:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        #bookmarks-widget .folder > span::after {
            content: "▼";
            font-size: 0.7em;
            margin-left: 5px;
        }

        #bookmarks-widget .folder-content {
            display: none;
            position: absolute;
            background-color: rgba(40, 40, 40, 0.95);
            min-width: 200px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            border-radius: 3px;
            padding: 5px 0;
            max-height: 80vh;
            overflow-y: auto;
        }

        #bookmarks-widget .folder:hover .folder-content {
            display: block;
        }

        #bookmarks-widget .folder-content a {
            display: block;
            padding: 8px 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #bookmarks-widget .folder-content .folder {
            display: block;
            position: relative;
        }

        #bookmarks-widget .folder-content .folder > span {
            display: block;
            padding: 8px 15px;
            cursor: pointer;
        }

        #bookmarks-widget .folder-content .folder > span::after {
            content: "►";
            font-size: 0.7em;
            margin-left: 5px;
            float: right;
        }

        #bookmarks-widget .folder-content .folder:hover > .folder-content {
            display: block;
            left: 100%;
            top: 0;
        }

        /* Adjust editor to make room for bookmarks bar */
        .CodeMirror {
            padding-top: 35px;
        }
    </style>
</head>

<body>
    <div id="bookmarks-widget">
        <div id="bookmarks-container">Loading bookmarks...</div>
    </div>

    <textarea id="code-editor"></textarea>

    <script>
        // Bookmarks parser
        async function loadBookmarks() {
            try {
                const response = await fetch('bookmarks.html');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const html = await response.text();
                parseBookmarks(html);
            } catch (error) {
                console.error('Error loading bookmarks:', error);
                document.getElementById('bookmarks-container').textContent = 'Error loading bookmarks';
            }
        }

        function parseBookmarks(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            // Find the main DL element that contains all bookmarks
            const mainDL = doc.querySelector('DL');
            if (!mainDL) {
                document.getElementById('bookmarks-container').textContent = 'No bookmarks found';
                return;
            }
            
            // Parse the bookmarks structure
            const bookmarksContainer = document.getElementById('bookmarks-container');
            bookmarksContainer.innerHTML = '';
            
            // Process the top-level bookmarks
            processBookmarkFolder(mainDL, bookmarksContainer, true);
        }

        function processBookmarkFolder(dlElement, container, isTopLevel = false) {
            // Process all direct children of the DL element
            let currentElement = dlElement.firstElementChild;
            
            while (currentElement) {
                if (currentElement.tagName === 'DT') {
                    // Check if this is a folder (has H3) or a bookmark (has A)
                    const h3Element = currentElement.querySelector('H3');
                    const aElement = currentElement.querySelector('A');
                    
                    if (h3Element) {
                        // This is a folder
                        const folderName = h3Element.textContent.trim();
                        const folderDiv = document.createElement('div');
                        folderDiv.className = 'folder';
                        
                        const folderSpan = document.createElement('span');
                        folderSpan.textContent = folderName;
                        folderDiv.appendChild(folderSpan);
                        
                        // Create container for folder contents
                        const folderContent = document.createElement('div');
                        folderContent.className = 'folder-content';
                        folderDiv.appendChild(folderContent);
                        
                        // Find the DL element that contains the folder's contents
                        const nestedDL = currentElement.querySelector('DL');
                        if (nestedDL) {
                            processBookmarkFolder(nestedDL, folderContent);
                        }
                        
                        container.appendChild(folderDiv);
                    } else if (aElement) {
                        // This is a bookmark
                        const bookmarkName = aElement.textContent.trim();
                        const bookmarkURL = aElement.getAttribute('HREF');
                        
                        const bookmarkLink = document.createElement('a');
                        bookmarkLink.href = bookmarkURL;
                        bookmarkLink.textContent = bookmarkName;
                        bookmarkLink.target = '_blank'; // Open in new tab
                        
                        // Add favicon if available
                        const iconData = aElement.getAttribute('ICON');
                        if (iconData) {
                            const favicon = document.createElement('img');
                            favicon.src = iconData;
                            favicon.style.width = '16px';
                            favicon.style.height = '16px';
                            favicon.style.marginRight = '5px';
                            favicon.style.verticalAlign = 'middle';
                            bookmarkLink.prepend(favicon);
                        }
                        
                        container.appendChild(bookmarkLink);
                    }
                }
                
                currentElement = currentElement.nextElementSibling;
            }
            
            // For top level, only show the first level of bookmarks (not the folders inside folders)
            if (isTopLevel) {
                const topLevelFolders = container.querySelectorAll('.folder > .folder-content > .folder');
                topLevelFolders.forEach(folder => {
                    folder.style.display = 'none';
                });
            }
        }

        // Load bookmarks when the page loads
        document.addEventListener('DOMContentLoaded', loadBookmarks);

        var editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
            lineNumbers: true,
	    lineWrapping: true,
            mode: "gfm",
            theme: "monokai",
        });

        CodeMirror.defineMode("linksOverlay", function (config, parserConfig) {
            return {
                token: function (stream, state) {
                    if (stream.match(/https?:\/\/[^\s]*/, false)) {
                        while (stream.next() != null && !stream.match(/\s/, false)) { }
                        return "url"; // CSS class to be applied
                    }
                    while (stream.next() != null && !stream.match(/https?:\/\/[^\s]*/, false)) { }
                    return null;
                }
            };
        });
        editor.addOverlay("linksOverlay");

        editor.on("mousedown", function (cm, event) {
            var target = event.target;
            // Check if Command key is pressed on macOS or Ctrl key on Windows/Linux and the 'cm-link' class
            if (target.classList.contains("cm-url") && (event.metaKey || event.ctrlKey)) {
                var url = target.textContent;
                if (url.endsWith(')')) {
                    // handle the case where the URL ends with a ')' character
                    url = url.slice(0, -1);
                    window.open(url, '_blank');
                } else {
                    window.open(url, '_blank').focus(); // Open the link in a new tab
                }
            }
        });

        // Load content from localStorage
        var savedContent = localStorage.getItem("editorContent");
        if (savedContent) {
            editor.setValue(savedContent);
        }

        // Save content to localStorage on change
        editor.on("change", function () {
            localStorage.setItem("editorContent", editor.getValue());
        });

        // Adjust the editor height to take up the full height of the viewport
        function adjustEditorHeight() {
            var height = window.innerHeight;
            editor.setSize(null, height + 'px');
        }

        // Adjust the height on initial load
        adjustEditorHeight();

        // Adjust the height whenever the window is resized
        window.onresize = adjustEditorHeight;

        // Add keyboard shortcut to toggle line numbers and widgets
        document.addEventListener('keydown', function(event) {
        // Check if Control + H is pressed
            if (event.ctrlKey && event.shiftKey&& (event.key === 'h' || event.key === 'H')) {
                // event.preventDefault(); // Prevent the default browser behavior

                // Toggle the visibility of line numbers
                var lineNumbersVisible = editor.getOption('lineNumbers');
                editor.setOption('lineNumbers', !lineNumbersVisible);

                // Toggle the CSS class for line numbers and adjust gutter width
                var lineNumbers = editor.display.wrapper.querySelectorAll('.CodeMirror-linenumber');
                var gutter = editor.display.wrapper.querySelector('.CodeMirror-gutters');

                if (lineNumbersVisible) {
                    // Hide line numbers and remove gutter width
                    lineNumbers.forEach(function(el) {
                        el.style.display = 'none';
                    });
                    gutter.style.width = '0px';
                    editor.refresh(); // Refresh editor to apply changes
                } else {
                    // Show line numbers and restore gutter width
                    lineNumbers.forEach(function(el) {
                        el.style.display = '';
                    });
                    gutter.style.width = ''; // Reset to default width
                    editor.refresh(); // Refresh editor to apply changes
                }

                // Toggle the visibility of elements with the 'widgets' class
                var widgets = document.querySelectorAll('.widgets');
                widgets.forEach(function(widget) {
                    widget.style.display = widget.style.display === 'none' ? 'flex' : 'none';                });
                
                // Toggle bookmarks widget
                var bookmarksWidget = document.getElementById('bookmarks-widget');
                bookmarksWidget.style.display = bookmarksWidget.style.display === 'none' ? 'flex' : 'none';
                
                // Adjust editor padding based on bookmarks visibility
                if (bookmarksWidget.style.display === 'none') {
                    document.querySelector('.CodeMirror').style.paddingTop = '0';
                } else {
                    document.querySelector('.CodeMirror').style.paddingTop = '35px';
                }
                
                editor.refresh(); // Refresh editor to apply changes
            }
        });
    </script>

    <div class="widgets" id="clock"></div>
    <script>
        document.getElementById('clock').addEventListener('click', function () {
            window.open('https://worldtimebuddy.com/', '_blank');
        });

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : '12'; // the hour '0' should be '12'
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
        }

        // Update the clock every second
        setInterval(updateClock, 1000);

        // Initialize the clock immediately
        updateClock();
    </script>
    <div class="widgets" id="weather"></div>
    <script>
        const cacheOptions = {
            maxEntries: 50,
            maxAge: 60 * 60 * 2, // 2 hours in seconds
        };
        async function getLocation() {
            try {
                // Check the cache for the response
                const cache = await caches.open('location-cache');
                const cachedResponse = await cache.match('https://ipapi.co/json/');

                if (cachedResponse) {
                    const data = await cachedResponse.json();
                    const latitude = data.latitude;
                    const longitude = data.longitude;
                    console.log('Location data retrieved from cache');
                    return { latitude, longitude };
                }

                // If the response is not in the cache, fetch the data from the network
                const response = await fetch('https://ipapi.co/json/');

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // Store the response in the cache for future use
                await cache.put('https://ipapi.co/json/', response.clone());

                const data = await response.json();
                const latitude = data.latitude;
                const longitude = data.longitude;
                console.log('Location data retrieved from network');
                return { latitude, longitude };
            } catch (error) {
                console.log('Fetch error: ', error);
                const latitude = 44.6609;
                const longitude = -88.2705;
                console.log(`Can't get location. Using default location.`);
                return { latitude, longitude };
            }
        }

        async function getWeather() {
            try {
                const { latitude, longitude } = await getLocation();
                console.log(`Latitude: ${latitude}\nLongitude: ${longitude}`);
                // Get station from location
                var response = await fetch('https://api.weather.gov/points/' + latitude + ',' + longitude);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                var data = await response.json();
                const station = data.properties.observationStations;
                console.log(`station: ${station}`);

                // Get station_id from station
                var response = await fetch(station);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                var data = await response.json();
                const station_url = data.features[0].id
                const stationIdentifier = data.features[0].properties.stationIdentifier
                const stationName = data.features[0].properties.name
                console.log(`station_url: ${station_url}\nstationIdentifier: ${stationIdentifier}\nstationName: ${stationName}`);

                // Get observations from station_url
                var response = await fetch(station_url + '/observations');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                var data = await response.json();
                const tempC = data.features[0].properties.temperature.value;
                const approx_tempF = Math.round((tempC * (9 / 5)) + 32);
                console.log(`tempC: ${tempC}\napprox_tempF: ${approx_tempF}`);

                const weather_icon = data.features[0].properties.icon;
                console.log(`weather_icon: ${weather_icon}`);
                weather_div = document.getElementById('weather')
                weather_div.innerHTML = `
                <img id="forecast-image" src="${weather_icon}"> <div id="weather-forecast">${approx_tempF}°F at ${stationIdentifier}
                <br>
                    <div id="forecast-links">
                        <a href="https://forecast.weather.gov/MapClick.php?lat=${latitude}&lon=${longitude}" target="_blank"><img src="https://forecast.weather.gov/build/images/favicon.eab6deff.ico"></a>
                        <a href="https://www.wunderground.com/weather/${latitude},${longitude}" target="_blank"><img src="https://www.wunderground.com/favicon.ico"></a>
                        <a href="https://www.windy.com/-Weather-radar-radar?radar,${latitude},${longitude},9" target="_blank"><img src="https://www.windy.com/img/favicon.png"></a>
                    </div>
                </div>`;
                weather_div.style.display = "flex";
            } catch (error) {
                console.log('Fetch error: ', error);
                var element = document.getElementById('weather');
                element.remove();
            }
        }

        getWeather();

    </script>
</body>

</html>
